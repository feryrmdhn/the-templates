<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Website Templates</title>

  <link rel="icon" type="image/png" sizes="32x32" href="_assets/img/favicon/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="_assets/img/favicon/favicon-16.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Great+Vibes&display=swap"
    rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@glidejs/glide@3.2.0/dist/css/glide.core.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@glidejs/glide@3.2.0/dist/css/glide.theme.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/lightgallery-js/1.4.0/css/lightgallery.min.css" rel="stylesheet" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

  <link rel="stylesheet" href="_assets/scss/app.css" />
</head>

<body class="opening-show">

  <section id="opening">
    <img class="ornament-corner ornament-tl" src="_assets/img/decoration/gold-frame-corner-tl.svg"
      data-aos="fade-down-right" data-aos-duration="1200" alt="" />
    <img class="ornament-corner ornament-tr" src="_assets/img/decoration/gold-frame-corner-tr.svg"
      data-aos="fade-down-left" data-aos-duration="1200" alt="" />
    <img class="ornament-corner ornament-bl" src="_assets/img/decoration/gold-frame-corner-bl.svg"
      data-aos="fade-up-right" data-aos-duration="1200" alt="" />
    <img class="ornament-corner ornament-br" src="_assets/img/decoration/gold-frame-corner-br.svg"
      data-aos="fade-up-left" data-aos-duration="1200" alt="" />

    <div class="opening-inner text-center">
      <img src="_assets/img/decoration/gold-flourish-top.png" class="opening-flourish" alt="" />
      <img src="_assets/img/decoration/gold-divider.png" class="gold-divider w-24rem w-lg-35rem" alt="" />

      <div class="d-flex justify-content-center align-items-center my-4 spouse-photos">
        <div class="img-wrapper-spouse">
          <img id="groom-photo" src="" alt="Groom" />
        </div>
        <div class="img-wrapper-spouse ms-3">
          <img id="bride-photo" src="" alt="Bride" />
        </div>
      </div>

      <h1 class="font-type-secondary text-primary spouse-text mt-3" id="groom-name" style="font-size: 4rem;"></h1>
      <h2 class="font-type-secondary text-light spouse-text" style="font-size: 3.5rem;">&amp;</h2>
      <h1 class="font-type-secondary text-primary spouse-text" id="bride-name" style="font-size: 4rem;"></h1>

      <p class="text-light mt-4">Kepada Yth.,</p>
      <p class="text-primary-200" id="guest">Bapak/Ibu/Saudara/i</p>
      <p class="text-light mt-3">Kami mengundang anda pada:</p>
      <p class="text-primary-200" id="reception-date-short"></p>

      <div class="d-flex justify-content-center mt-3">
        <button id="btn-open-opening" class="btn btn-primary">
          <i class="fa-solid fa-envelope me-2"></i> Buka Undangan
        </button>
      </div>

      <img src="_assets/img/decoration/gold-flourish-bottom.png" class="opening-flourish mt-3" alt="" />
    </div>
  </section>

  <button id="btn-play" class="btn btn-light btn-audio">
    <i class="fa-solid fa-volume-xmark"></i>
  </button>
  <audio id="audio" loop class="d-none"></audio>

  <div id="carouselExampleFade" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-touch="false"
    data-bs-interval="false">
    <div class="carousel-inner">

      <div class="carousel-item active">
        <section id="section-1" class="section-block">
          <img src="_assets/img/decoration/gold-ornament-top-lg.png" class="ornament-lg ornament-top-left"
            data-aos="fade-down-right" alt="" />
          <img src="_assets/img/decoration/gold-ornament-bottom-lg.png" class="ornament-lg ornament-bottom-right"
            data-aos="fade-up-left" alt="" />

          <div class="container position-relative" style="z-index:2;">
            <div class="text-center">
              <img src="_assets/img/decoration/gold-divider.png" class="gold-divider w-24rem w-lg-35rem" alt="" />
              <h1 class="font-type-secondary text-primary mt-3" style="font-size: 4.5rem;">Jadwal &nbsp; Acara</h1>
            </div>
            <div class="row mt-5 g-4">
              <div class="col-lg-6">
                <div class="event-card text-center p-4">
                  <h3 class="font-type-secondary text-primary" id="akad-day-label">Akad Nikah</h3>
                  <img src="_assets/img/decoration/gold-diamond-separator.svg" class="my-3" width="30" alt="" />
                  <div class="row text-center text-light">
                    <div class="col">
                      <p class="mb-0" id="akad-day"></p>
                    </div>
                    <div class="col">
                      <p class="mb-0 text-primary" id="akad-date-num" style="font-size:4rem;line-height:1;"></p>
                      <p class="mb-0" id="akad-month"></p>
                      <p class="mb-0" id="akad-year"></p>
                    </div>
                    <div class="col">
                      <p class="mb-0" id="akad-time"></p>
                    </div>
                  </div>
                  <p class="mt-3 text-light"><i class="fa-solid fa-map-marker-alt text-primary me-2"></i><span
                      id="akad-venue"></span></p>
                </div>
              </div>
              <div class="col-lg-6">
                <div class="event-card text-center p-4">
                  <h3 class="font-type-secondary text-primary" id="reception-day-label">Resepsi</h3>
                  <img src="_assets/img/decoration/gold-diamond-separator.svg" class="my-3" width="30" alt="" />
                  <div class="row text-center text-light">
                    <div class="col">
                      <p class="mb-0" id="reception-day"></p>
                    </div>
                    <div class="col">
                      <p class="mb-0 text-primary" id="reception-date-num" style="font-size:4rem;line-height:1;"></p>
                      <p class="mb-0" id="reception-month"></p>
                      <p class="mb-0" id="reception-year"></p>
                    </div>
                    <div class="col">
                      <p class="mb-0" id="reception-time"></p>
                    </div>
                  </div>
                  <p class="mt-3 text-light"><i class="fa-solid fa-map-marker-alt text-primary me-2"></i><span
                      id="reception-venue"></span></p>
                </div>
              </div>
            </div>
            <div class="mt-4">
              <iframe id="gmap_canvas" src="" width="100%" height="200" style="border:0;border-radius:10px;"
                loading="lazy"></iframe>
            </div>
          </div>
        </section>
      </div>

      <div class="carousel-item">
        <section id="section-2" class="section-block">
          <div class="container position-relative" style="z-index:2;">
            <div class="text-center">
              <h2 class="font-type-secondary text-primary" style="font-size: 3rem;">RSVP &nbsp; &amp; &nbsp; Ucapan</h2>
              <img src="_assets/img/decoration/gold-divider.png" class="gold-divider w-24rem w-lg-35rem" alt="" />
            </div>
            <div class="row mt-5 g-4">
              <div class="col-lg-7">
                <div class="rsvp-card p-4">
                  <form id="rsvp-form">
                    <div class="mb-3">
                      <input type="text" name="name" class="form-control" placeholder="Nama Anda" required />
                    </div>
                    <div class="mb-3">
                      <input type="text" name="phone" class="form-control" placeholder="Whatsapp / Hp" />
                    </div>
                    <div class="mb-3">
                      <select name="attendance" class="form-select">
                        <option value="">Bersedia hadir di acara kami?</option>
                        <option value="yes">Ya, saya akan hadir</option>
                        <option value="no">Maaf, tidak bisa hadir</option>
                      </select>
                    </div>
                    <div class="mb-3">
                      <textarea name="message" class="form-control" rows="4" placeholder="Kirim ucapan"
                        required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Jawab Undangan</button>
                  </form>
                </div>
              </div>
              <div class="col-lg-5">
                <div class="wishes-card p-4">
                  <h4 class="font-type-secondary text-light text-center">Daftar Ucapan</h4>
                  <div id="wishes-list" class="wishes-list mt-3"></div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <div class="carousel-item">
        <section id="section-3" class="section-block">
          <img src="_assets/img/decoration/gold-ornament-top-lg.png" class="ornament-lg ornament-top-left"
            data-aos="fade-down-right" alt="" />
          <img src="_assets/img/decoration/gold-ornament-bottom-lg.png" class="ornament-lg ornament-bottom-right"
            data-aos="fade-up-left" alt="" />
          <div class="container position-relative" style="z-index:2;">
            <div class="text-center mb-5">
              <h1 class="font-type-secondary text-primary" style="font-size: 4.5rem;">Galeri</h1>
              <img src="_assets/img/decoration/gold-divider.png" class="gold-divider w-24rem w-lg-35rem mt-3" alt="" />
            </div>
            <div class="row align-items-center">
              <div class="col-md-5 col-lg-4 offset-lg-1">
                <img id="glide-gallery-preview" src="" class="glide-gallery-preview" alt="" />
              </div>
              <div class="col-md-7 col-lg-6">
                <div class="glide glide-gallery mt-4">
                  <div class="glide__track" data-glide-el="track">
                    <ul id="gallery-slides" class="glide__slides"></ul>
                  </div>
                  <div class="glide__arrows mt-3" data-glide-el="controls">
                    <button class="btn btn-outline-light me-2" data-glide-dir="<"><i
                        class="fa-solid fa-chevron-left"></i></button>
                    <button class="btn btn-outline-light" data-glide-dir=">"><i
                        class="fa-solid fa-chevron-right"></i></button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <div class="carousel-item">
        <section id="section-4" class="section-block d-flex flex-column justify-content-center align-items-center">
          <img src="_assets/img/decoration/gold-ornament-left.png" class="ornament-side ornament-side-left"
            data-aos="fade-right" alt="" />
          <img src="_assets/img/decoration/gold-ornament-right.png" class="ornament-side ornament-side-right"
            data-aos="fade-left" alt="" />
          <div class="container text-center position-relative" style="z-index:2;">
            <i class="fa-solid fa-crown text-primary mb-3" style="font-size: 5rem;"></i>
            <p id="quote" class="font-type-secondary text-primary fs-3 mx-auto" style="max-width:60rem;"></p>
            <img src="_assets/img/decoration/ruby-gem.png" width="40" class="my-4" alt="" />
            <h2 class="font-type-secondary text-primary" id="groom-name-2"></h2>
            <h3 class="font-type-secondary text-light">&amp;</h3>
            <h2 class="font-type-secondary text-primary" id="bride-name-2"></h2>

            <div id="payment-section" class="mt-5" style="display:none;">
              <h3 class="font-type-secondary text-light">Amplop Digital</h3>
              <div id="payment-list" class="d-flex flex-wrap justify-content-center gap-3 mt-3"></div>
            </div>

            <p class="tenant-label">Digital Invitation by</p>
            <img id="tenant-logo" src="/placeholder-image.png" alt="Tenant Logo" class="tenant-logo" />
            <div id="tenant-social" class="tenant-social"></div>
          </div>
        </section>
      </div>

    </div>
  </div>

  <div class="btn-group-action-container">
    <button class="fab-btn active" data-bs-target="#carouselExampleFade" data-bs-slide-to="0"><i
        class="fa-solid fa-calendar"></i></button>
    <button class="fab-btn" data-bs-target="#carouselExampleFade" data-bs-slide-to="1"><i
        class="fa-solid fa-comment"></i></button>
    <button class="fab-btn" data-bs-target="#carouselExampleFade" data-bs-slide-to="2"><i
        class="fa-solid fa-image"></i></button>
    <button class="fab-btn" data-bs-target="#carouselExampleFade" data-bs-slide-to="3"><i
        class="fa-solid fa-gem"></i></button>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery-js/1.4.0/js/lightgallery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/timezz@6.1.0/dist/timezz.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@glidejs/glide@3.2.0/dist/glide.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>

  <script src="/_shared/var4.js"></script>
  <script src="/_shared/api.js"></script>

  <script src="_assets/js/app.js"></script>
</body>

</html>
